<nz-form-item>
  @if (label()) {
    <ng-container [ngTemplateOutlet]="label()"></ng-container>
  }

  <nz-form-control [nzErrorTip]="errorTemplate">
    <ng-container *ngTemplateOutlet="prefixTemplate" />
    <!-- @todo Grid instead of min-width: 50%? Will this be responsive enough like this? -->
    <nz-input-number
      #inputComponent
      [required]="state().required"
      [nzMin]="minNumber"
      [nzMax]="maxNumber"
      [nzFormatter]="inputFormatter"
      [nzParser]="inputParser"
      [disabled]="!inlineEdit().enabled"
      [nzPlaceHolder]="state().placeholderValue ?? ''"
      [(ngModel)]="state().defaultValue"
      (change)="onChange($event)"
      (mousedown)="$event.stopPropagation()"
      [nzStep]="state().stepNumber"
      class="number-input"
    />
  </nz-form-control>
</nz-form-item>
<ng-template #errorTemplate let-control>
  @for (message of getErrorMessages(control); track message) {
    <div>{{ message }}</div>
  }
</ng-template>
<ng-template #prefixTemplate>
  @if (state().showTooltip) {
    <span
      nz-icon
      nz-tooltip
      [nzTooltipTitle]="state().tooltipText"
      nzType="info-circle"
      class="icon-margin"
    ></span>
  }
</ng-template>
