name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests and summarize results
        run: |
          set +e
          npm run test:e2e
          test_status=$?
          set -e

          if [ -f playwright-report/results.json ]; then
            node -e '
              const fs = require("node:fs");
              const { stats } = JSON.parse(fs.readFileSync("playwright-report/results.json", "utf8"));
              const passed = stats.expected + stats.flaky;
              const summary = [
                "## Playwright UI tests",
                "",
                `- Passed: ${passed}`,
                `- Flaky (passed after retry): ${stats.flaky}`,
                `- Failed: ${stats.unexpected}`,
                `- Skipped: ${stats.skipped}`,
                ""
              ].join("\n");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              console.log(summary);
            '
          else
            echo "## Playwright UI tests" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Test counts are unavailable because the JSON report was not created." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$test_status"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests with coverage
        run: |
          export CHROME_BIN="$(node -p "require('playwright').chromium.executablePath()")"
          set +e
          npm run test:coverage 2>&1 | tee unit-test-output.log
          test_status=${PIPESTATUS[0]}
          set -e

          total_line="$(grep -E '^TOTAL:' unit-test-output.log | tail -n 1 || true)"
          echo "## Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$total_line" ]; then
            passed="$(printf '%s\n' "$total_line" | grep -oE '[0-9]+ SUCCESS' | tail -n 1 | cut -d ' ' -f 1)"
            echo "- Passed: ${passed:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Result: \`$total_line\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Passed: ${passed:-0}"
            echo "$total_line"
          else
            echo "Test counts are unavailable because the test runner did not report a total." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$test_status"

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 30

  bump:
    runs-on: ubuntu-latest
    needs: [quality, test, unit-tests]
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: bump version [skip ci]"

      - name: Push version bump
        run: git push origin main
